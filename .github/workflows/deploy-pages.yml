name: Deploy site to GitHub Pages

# Pages is configured to serve from the gh-pages branch. This workflow keeps
# that branch in sync: every push to the branches below republishes the site.

on:
  push:
    branches: [claude/tender-meitner-hrd0rx, main, master]
    paths: [index.html, assets/**, learn/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir /tmp/dist
          cp index.html /tmp/dist/
          [ -d assets ] && cp -r assets /tmp/dist/ || true
          [ -d learn ] && cp -r learn /tmp/dist/ || true
          touch /tmp/dist/.nojekyll
      - name: Push to gh-pages
        run: |
          cd /tmp/dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
